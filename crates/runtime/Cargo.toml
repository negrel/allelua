[package]
name = "allelua_runtime"
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"
description = "Lua runtime blessed by programming gods."
documentation = "https://docs.rs/allelua_runtime"
repository = "https://github.com/negrel/allelua"
readme = "README.md"
authors = ["Alexandre Negrel <alexandre@negrel.dev>"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
mlua = { version = "0.11.5", default-features = false, features = [
  "luajit52",
  "vendored",
] }
